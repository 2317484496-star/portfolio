<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 · 这里没有内容 — 作品集</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23030409'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%2322E1FF' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%2322E1FF'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #03040A; --ink-1: #F2F6FF; --ink-3: #8C99AE; --ink-4: #5A677C;
    --acc: #22E1FF; --acc-rgb: 34, 225, 255;
    --hair: rgba(255, 255, 255, 0.078);
    --mono: "Cascadia Mono", "SF Mono", Consolas, "Liberation Mono", monospace;
    --disp: "Bahnschrift", "DIN Alternate", "Oswald", "PingFang SC", sans-serif;
    --sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background:
      radial-gradient(120% 90% at 82% 18%, rgba(var(--acc-rgb), 0.10), transparent 60%),
      radial-gradient(100% 80% at 10% 92%, rgba(140, 60, 255, 0.10), transparent 62%),
      var(--bg);
    color: var(--ink-1);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    padding: 32px;
  }
  main { width: min(640px, 100%); }
  .k {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.34em;
    text-transform: uppercase; color: var(--acc);
  }
  h1 {
    margin: 18px 0 0; font-size: clamp(64px, 16vw, 128px); line-height: 0.92;
    font-family: var(--disp); font-weight: 700; letter-spacing: -0.02em;
  }
  h1 small {
    display: block; margin-top: 10px;
    font-family: var(--sans); font-size: clamp(17px, 3.6vw, 22px);
    font-weight: 400; line-height: 1.5; color: var(--ink-3); letter-spacing: 0;
  }
  hr { margin: 34px 0; border: 0; border-top: 1px solid var(--hair); }
  p { margin: 0 0 22px; font-size: 14px; line-height: 1.85; color: var(--ink-4); }
  a.go {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 18px; border: 1px solid rgba(var(--acc-rgb), 0.5);
    background: rgba(var(--acc-rgb), 0.07);
    color: var(--ink-1); text-decoration: none;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    transition: background 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
  }
  a.go:hover { background: rgba(var(--acc-rgb), 0.14); transform: translateX(4px); }
  footer {
    margin-top: 40px; font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-4);
  }
</style>
</head>
<body>
<main>
  <div class="k" id="path">ERROR / 404 · NOT FOUND</div>
  <h1>404<small>这个地址下没有内容。</small></h1>
  <hr>
  <p>作品集的每部作品都挂在首页的深链上（形如 <code>#witch</code>），
     所以站内没有第二层真实路径 —— 出现这个页面，通常说明链接被截断或拼错了。</p>
  <a class="go" id="back" href="./">返回作品集 →</a>
  <footer>SELECTED WORKS · 2024 — 2026</footer>
</main>
<script>
  /* GitHub Pages 会把任意未命中的路径交给本站根的 /404.html，
     此时相对路径的基准是那串错误地址，不能直接写死 './'。
     所以按 404.html 自身所在的目录算出站点根。
     不做自动跳转 —— 直接夺走访问者的控制权不礼貌，给一个明确的出口就够了。 */
  (function () {
    var p = location.pathname.replace(/404\.html$/, '');
    var root = location.origin + p;
    var a = document.getElementById('back');
    if (a) a.setAttribute('href', root);
    var d = document.getElementById('path');
    if (d) d.textContent = 'ERROR / 404 · ' + location.pathname;
  })();
</script>
</body>
</html>
